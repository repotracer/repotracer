<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img" aria-label="Without RepoTracer, Claude Code or Codex investigates, reasons, implements, and verifies in one conversation. With RepoTracer, a separate conversation investigates the repo and reports back, and Claude Code or Codex reasons, implements, and verifies.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 13px; letter-spacing: 1.5px; font-weight: 600; }
    .head { font-size: 20px; font-weight: 600; fill: #14181D; }
    .sub { font-size: 13px; fill: #5F6670; }
    .step { font-size: 17px; fill: #14181D; }
    .num { font-size: 13px; fill: #5F6670; }
  </style>

  <rect width="1200" height="564" rx="12" fill="#F6F5F1"/>

  <!-- Without RepoTracer -->
  <text x="56" y="60" class="mono eyebrow" fill="#5F6670">WITHOUT REPOTRACER</text>
  <rect x="56.5" y="84.5" width="515" height="455" rx="8" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="80" y="118" class="sans head">Claude Code / Codex</text>
  <text x="80" y="142" class="mono sub">one conversation</text>

  <rect x="80.5" y="160.5" width="467" height="47" rx="6" fill="#FBF3E4" stroke="#E7C98F"/>
  <text x="100" y="189" class="mono num">01</text>
  <text x="136" y="190" class="sans step">investigate the repo</text>
  <text x="528" y="189" class="mono num" text-anchor="end" style="fill:#8A5A0B">same limits</text>

  <path d="M314 216 V254 M308 248 L314 254 L320 248" stroke="#B9B9B0" stroke-width="1.5" fill="none"/>

  <rect x="80.5" y="263.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="100" y="292" class="mono num">02</text>
  <text x="136" y="293" class="sans step">reason about the change</text>

  <path d="M314 319 V356 M308 350 L314 356 L320 350" stroke="#B9B9B0" stroke-width="1.5" fill="none"/>

  <rect x="80.5" y="365.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="100" y="394" class="mono num">03</text>
  <text x="136" y="395" class="sans step">implement</text>

  <path d="M314 421 V459 M308 453 L314 459 L320 453" stroke="#B9B9B0" stroke-width="1.5" fill="none"/>

  <rect x="80.5" y="468.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="100" y="497" class="mono num">04</text>
  <text x="136" y="498" class="sans step">verify</text>

  <!-- With RepoTracer -->
  <text x="628" y="60" class="mono eyebrow" fill="#0A6E66">WITH REPOTRACER</text>
  <rect x="628.5" y="84.5" width="515" height="147" rx="8" fill="#EEF6F4" stroke="#9FCFC8"/>
  <text x="652" y="118" class="sans head" style="fill:#0A6E66">RepoTracer</text>
  <text x="652" y="142" class="mono sub">separate conversation</text>

  <rect x="652.5" y="160.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#9FCFC8"/>
  <text x="672" y="189" class="mono num" style="fill:#0A6E66">01</text>
  <text x="708" y="190" class="sans step">investigate the repo</text>

  <path d="M886 236 V259 M880 253 L886 259 L892 253" stroke="#0A6E66" stroke-width="1.5" fill="none"/>
  <text x="902" y="253" class="mono num" style="fill:#0A6E66">reports back</text>

  <rect x="628.5" y="264.5" width="515" height="275" rx="8" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="652" y="298" class="sans head">Claude Code / Codex</text>
  <text x="652" y="322" class="mono sub">continues from the report</text>

  <rect x="652.5" y="340.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="672" y="369" class="mono num">02</text>
  <text x="708" y="370" class="sans step">reason about the change</text>

  <rect x="652.5" y="404.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="672" y="433" class="mono num">03</text>
  <text x="708" y="434" class="sans step">implement</text>

  <rect x="652.5" y="468.5" width="467" height="47" rx="6" fill="#FCFCFA" stroke="#DFDFD8"/>
  <text x="672" y="497" class="mono num">04</text>
  <text x="708" y="498" class="sans step">verify</text>
</svg>
