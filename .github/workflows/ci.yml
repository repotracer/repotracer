name: ci

on:
  push:
    branches: [main]
    # Docs, assets, and the marketing copy cannot break the build, so they must
    # not spin up three Rust toolchains.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'benchmarks/results/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'benchmarks/results/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fmt
        run: cargo fmt --all -- --check

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Version parity
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_version=$(node -p "require('./packages/npm/package.json').version")
          echo "cargo=$cargo_version npm=$npm_version"
          test "$cargo_version" = "$npm_version"
      - name: Test
        working-directory: packages/npm
        run: node --test test/*.test.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        run: choco install ripgrep -y
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.149.1
      - name: Codex read-only sandbox smoke test
        shell: pwsh
        run: |
          codex --version
          codex sandbox -P :read-only -C "$PWD" git rev-parse HEAD
          codex sandbox -P :read-only -C "$PWD" git status --short --branch
      - name: Test
        run: cargo test --workspace
