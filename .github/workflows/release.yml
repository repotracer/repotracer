name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: grephound-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: grephound-linux-arm64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: grephound-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: grephound-darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: grephound-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build -p grephound --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=grephound
          ext=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then ext=".exe"; fi
          src="target/${{ matrix.target }}/release/${bin}${ext}"
          stage="${{ matrix.artifact }}"
          mkdir -p dist
          cp "$src" "dist/${bin}${ext}"
          cp README.md LICENSE NOTICE dist/ || true
          cd dist
          if [[ -n "$ext" ]]; then
            7z a "../${{ matrix.artifact }}.zip" *
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
