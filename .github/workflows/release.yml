name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: repotracer-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: repotracer-linux-arm64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: repotracer-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: repotracer-darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: repotracer-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build -p repotracer --release --target ${{ matrix.target }}
      - name: Cross-build
        if: matrix.cross
        run: cross build -p repotracer --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=repotracer
          ext=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then ext=".exe"; fi
          src="target/${{ matrix.target }}/release/${bin}${ext}"
          mkdir -p dist
          cp "$src" "dist/${bin}${ext}"
          cp "$src" "${{ matrix.artifact }}${ext}"
          cp README.md LICENSE NOTICE dist/ || true
          cd dist
          if [[ -n "$ext" ]]; then
            7z a "../${{ matrix.artifact }}.zip" ./*
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" ./*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Needed to read the tag annotation for the release body.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          cd artifacts
          # Write outside the tree first: redirecting into it makes find hash SHA256SUMS itself.
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from the tag annotation
        id: notes
        run: |
          # The tag message becomes the release body, so write it for a human:
          # one plain sentence saying what changed.
          # checkout leaves a lightweight ref, so %(contents:body) would return
          # the commit message instead of the annotation. Fetch the tag object.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)')
          [ -n "$body" ] || body=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          {
            echo 'body<<RELEASE_BODY'
            echo "$body"
            echo 'RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
