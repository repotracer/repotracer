name: repository hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep private research out of product history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          base = os.environ.get("BASE_SHA", "")
          revision = f"{base}..HEAD" if base and set(base) != {"0"} else "HEAD"
          paths = subprocess.check_output(
              ["git", "log", revision, "--diff-filter=ACMR", "--format=", "--name-only"],
              text=True,
          ).splitlines()
          # Public benchmark docs and artifacts (BENCHMARKS.md, benchmarks/,
          # docs/benchmarks/) and the launch article are allowed.
          forbidden = re.compile(r"(^|/)research/|^crates/bench/|^docs/\.internal/|^benchmarks\.html$|^scripts/summarize-results(?:\.py)?$|^assets/(button-benchmarks\.svg|benchmark-card\.png|results-proof\.png)$")
          found = sorted({path for path in paths if forbidden.search(path)})
          if found:
              raise SystemExit(
                  "Private artifacts added or modified by this change:\n"
                  + "\n".join(found)
                  + "\n(this check reads only the commits under review, not the whole history)"
              )
          print("No private research files were added or modified by this change.")
          PY
