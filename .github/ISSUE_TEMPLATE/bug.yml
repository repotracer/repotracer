name: Bug
description: Something broken in repotracer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Include `repotracer doctor` output when possible.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: repotracer doctor
  - type: input
    id: version
    attributes:
      label: Version
