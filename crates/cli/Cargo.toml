[package]
name = "repotracer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Repository scout for AI coding agents"
repository.workspace = true
default-run = "repotracer"

[[bin]]
name = "repotracer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
repotracer-core.workspace = true
repotracer-mcp.workspace = true
repotracer-model.workspace = true
repotracer-repo-tools.workspace = true
reqwest.workspace = true
self-replace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit = "=0.22.27"
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
