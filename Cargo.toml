[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/repo-tools",
    "crates/model",
    "crates/cli",
    "crates/mcp",
    "crates/bench",
]
default-members = ["crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/repotracer/repotracer"
homepage = "https://github.com/repotracer/repotracer"
authors = ["RepoTracer Contributors"]
rust-version = "1.80"

[workspace.dependencies]
repotracer-core = { path = "crates/core" }
repotracer-repo-tools = { path = "crates/repo-tools" }
repotracer-model = { path = "crates/model" }
repotracer-mcp = { path = "crates/mcp" }
repotracer-bench = { path = "crates/bench" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
